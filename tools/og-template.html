<!DOCTYPE html>
<html lang="ru">
<!-- Шаблон превью для соцсетей. Снимается скриншотом 1200x630 в img/og.png. -->
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    background: #080b10;
    color: #e8eef6;
    font-family: "Inter", sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px;
    position: relative; overflow: hidden;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(700px 420px at 78% -10%, rgba(34,211,238,.16), transparent 70%),
      radial-gradient(600px 380px at 0% 110%, rgba(232,121,249,.10), transparent 70%),
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px) 0 0 / 100% 40px,
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px) 0 0 / 40px 100%;
  }
  .row { position: relative; }
  .brand { font-family: "Exo 2", sans-serif; font-weight: 700; font-size: 32px; letter-spacing: .02em; }
  .brand span { color: #22d3ee; }
  h1 {
    font-family: "Exo 2", sans-serif; font-weight: 600;
    font-size: 76px; line-height: 1.12; letter-spacing: -.01em;
  }
  h1 em { font-style: normal; color: #22d3ee; }
  .sub { color: #a3b4c7; font-size: 26px; margin-top: 24px; }
  .foot {
    display: flex; align-items: center; gap: 16px;
    font-family: "Exo 2", sans-serif; font-size: 24px; color: #a3b4c7;
    border-top: 1px solid #1e2a38; padding-top: 24px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; }
  .tag {
    border: 1px solid #2a4457; border-radius: 999px; padding: 6px 16px;
    font-size: 20px; color: #e8eef6;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="row brand">// <span>Kenny</span></div>
  <div class="row">
    <h1>Собираю инструменты,<br><em>которые работают</em></h1>
    <p class="sub">Портфолио проектов на чистых HTML, CSS и JavaScript</p>
  </div>
  <div class="row foot">
    <span class="dot"></span>
    <span>github.com/KennyS44</span>
    <span class="tag">Journeyman</span>
    <span class="tag">Brightside</span>
    <span class="tag">Roastery</span>
  </div>
</body>
</html>
